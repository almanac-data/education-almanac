notes: |
  Human-verified 2026-10-31: HTTP 200. The page links a data catalogue and API documentation and states "All content is available under the Open Government Licence v3.0, except where otherwise stated". The service is regulated by the Office for Statistics Regulation. Coverage is England only; education is devolved, so Scotland, Wales, and Northern Ireland publish their own statistics. Each official statistics release has its own schedule, so cadence is event. auth_required: false assumes the public API needs no key; a steward should confirm it.
