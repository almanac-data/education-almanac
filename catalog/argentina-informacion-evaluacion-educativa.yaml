notes: |
  Human-verified 2026-10-31: HTTP 200. The old URL /educacion/evaluacion-e-informacion-educativa redirects here. The page lists "Datos abiertos: Bases de datos de Aprender y Relevamiento Anual", "Reportes por escuela: Plataforma de microdatos por escuela", "Padrón Nacional de Establecimientos Educativos", and SICDIE, the indicators query system. The datos-abiertos page footer states "Los contenidos de Argentina.gob.ar están licenciados bajo Creative Commons Atribución 4.0 Internacional". The publisher name is taken from the URL path and ministry branding, and should be confirmed by a steward. The national open data portal, datos.gob.ar, did not respond this session.
