type: dataset
title: IEA PIRLS International Database (Progress in International Reading Literacy Study)
description: |
  Student, home, teacher and school microdata and reading achievement scores from IEA's PIRLS assessments of fourth-grade reading every five years from 2001 to 2021, including ePIRLS and PIRLS Literacy 2016, with documentation for secondary analysis.
publisher: International Association for the Evaluation of Educational Achievement (IEA); study directed by the TIMSS & PIRLS International Study Center, Boston College
