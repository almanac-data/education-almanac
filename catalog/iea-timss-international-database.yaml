  identifiers:
    doi: 10.58150/IEA_TIMSS_2023_G8_data_edition_1
access:
  method:
  - web
  - bulk
  auth_required: false
  auth_note: No registration for public-use files, but downloading requires ticking "I agree to the terms and conditions" (IEA Disclaimer and License Agreement). Restricted-use variables require an application and a non-disclosure agreement.
  rate_limit: null
format:
- sas
- spss
- r
