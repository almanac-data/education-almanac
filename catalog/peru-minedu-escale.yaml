notes: |
  Human-verified 2026-10-31 in headless Chromium (title "Inicio - ESCALE - Unidad de Estadística Educativa"). The page announces "Se publicaron las bases de datos del Censo Educativo 2025" and the start of the 2026 census collection. It lists services, indicators, school maps, and "Estadística OnLine". Plain curl sometimes gets a Check Point CloudGuard bot-verification page, but scripts/check_links.py reported it ok (HTTP 200) the same day. If a later probe reports blocked, that is bot protection, not a dead link. The csv format and the license are unverified.
