notes: |
  Human-verified 2026-10-31: HTTP 200. The page describes "An annual report that presents data collected from the Pupil Level Annual School Census, with additional information on the schools and their teachers and support staff". It shows "First published: 24 July 2014", "Last updated: 5 August 2026", and the latest release, "Schools' census results: January 2026". More detailed tables are on StatsWales, whose old address redirects to stats.gov.wales. The licence and formats are unverified.
  Reachability is touchy. On 2026-10-31 a browser-UA curl got HTTP 200 (once after 11 s, once in 0.3 s), a curl with no user agent got HTTP 403, and scripts/check_links.py timed out at its 12 s limit. A link-checker flag on this entry may be slowness or bot filtering rather than a dead page.
