id: mexico-sep-formato-911
type: dataset
title: Mexico SEP Formato 911 School Census Statistics (SIGED open data)
description: |
  Open data from the Secretaría de Educación Pública's Formato 911 school census: students, teachers and schools at the start of each school year for basic, upper-secondary (media superior) and higher education, school-level files in CSV and TXT. They are published through SEP's Sistema de Información y Gestión Educativa (SIGED), alongside the DGPPYEE's national statistical publications.
publisher: Secretaría de Educación Pública (SEP), Dirección General de Planeación, Programación y Estadística Educativa (DGPPYEE)
