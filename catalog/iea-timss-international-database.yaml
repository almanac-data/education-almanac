id: iea-timss-international-database
type: dataset
title: IEA TIMSS International Database (Trends in International Mathematics and Science Study)
description: |
  Student, teacher, school and home microdata and achievement scores from IEA's TIMSS assessments of mathematics and science at grades 4 and 8, every four years from 1995 to 2023, with documentation for secondary analysis. TIMSS Longitudinal and TIMSS Advanced data have their own repository pages.
publisher: International Association for the Evaluation of Educational Achievement (IEA); study directed by the TIMSS & PIRLS International Study Center, Boston College
jurisdiction:
  scope: international-ngo
  country: null
topics:
- assessment
- learning-outcomes
- mathematics
- science
- international
- microdata
