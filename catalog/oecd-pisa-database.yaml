id: oecd-pisa-database
type: dataset
title: OECD PISA Database (Programme for International Student Assessment)
description: |
  Public-use microdata from the OECD's Programme for International Student Assessment, the triennial assessment of 15-year-olds in reading, mathematics and science. It includes student, school and teacher questionnaire files, cognitive item and timing files, and innovative-domain files (financial literacy, creative thinking) for every cycle from PISA 2000 to PISA 2025.
