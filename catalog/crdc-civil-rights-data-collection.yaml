attribution: U.S. Department of Education, Office for Civil Rights, Civil Rights Data Collection
notes: |
  Human-verified 2026-10-31: HTTP 200. The site renders only with JavaScript; headless Chromium shows its description as "a mandatory survey of all public school districts and schools in the 50 states, Washington, D.C., and the Commonwealth of Puerto Rico". The downloads page (https://civilrightsdata.ed.gov/data) lists files for 2023-24, 2021-22, 2020-21, 2017-18, and 2015-16. Collections are usually biennial but the gaps vary, so cadence is irregular. The csv format is assumed from the download files and should be confirmed by a steward.
