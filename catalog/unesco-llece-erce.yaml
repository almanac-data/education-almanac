id: unesco-llece-erce
type: dataset
title: UNESCO LLECE ERCE 2019 Regional Learning Assessment Databases
description: |
  Student, teacher, family and school databases from ERCE 2019 (Estudio Regional Comparativo y Explicativo), the fourth regional learning assessment of primary students in Latin America and the Caribbean. It was run by UNESCO's Latin American Laboratory for Assessment of the Quality of Education (LLECE) in 16 countries, and the databases come with codebooks, questionnaires and a user manual.
