notes: |
  Human-verified 2026-10-31: HTTP 200. The page lists microdata for the Censo Escolar, the Censo da Educação Superior, Enade, and other INEP surveys and exams. It notes that file formats are being restructured to remove the possibility of identifying individuals. The INEP Dados Abertos page states "Todo o conteúdo deste site está publicado sob a licença Creative Commons Atribuição-SemDerivações 3.0 Não Adaptada" (CC BY-ND 3.0). That is a site-wide statement, recorded as found; a steward should confirm whether it is meant to cover the microdata. The csv/zip formats come from INEP's usual distribution and weren't checked.
