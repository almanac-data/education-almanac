id: crdc-civil-rights-data-collection
type: dataset
title: Civil Rights Data Collection (CRDC)
description: |
  The Office for Civil Rights' mandatory survey of every U.S. public school district and school, collecting data on students' equal access to educational opportunity — course access, discipline, restraint and seclusion, harassment, and more — by race, sex, disability, and English learner status.
publisher: U.S. Department of Education, Office for Civil Rights (OCR)
