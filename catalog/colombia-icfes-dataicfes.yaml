id: colombia-icfes-dataicfes
type: dataset
title: Colombia ICFES DataIcfes (national exam microdata)
description: |
  DataIcfes is the data repository of Colombia's Instituto Colombiano para la Evaluación de la Educación. It holds anonymised results databases from the national exams (Saber 3°, 5°, 7° and 9°, Saber 11°, Saber TyT, Saber Pro and others), with evaluees' socioeconomic information, for research on education quality.
