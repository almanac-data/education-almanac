notes: |
  Human-verified 2026-10-31: HTTP 200. The page lists the subject Report Cards (mathematics, reading, civics, long-term trend, and others) and the Data Tools: Data Explorer, State and District Profiles, and the NAEP Data Service API. Assessments run on a rotating subject schedule (core subjects about every two years), so cadence is irregular. The 1969 and 1990 start dates come from NCES's usual description and weren't checked here. The publisher line follows NAEP's usual statement that NCES administers it under the Governing Board's policy.
