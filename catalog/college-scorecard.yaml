notes: |
  Human-verified 2026-10-31: HTTP 200. The page says "This data was last updated October 15, 2026" and offers an all-data zip (536 MB) of institution-level files for 1996-97 through 2025-26. The API documentation page states that an API key is required for every request, with base URL https://api.data.gov/ed/collegescorecard/v1/schools. The note in the description about combining IPEDS, federal student aid, and Treasury data reflects the Scorecard's documented sources; a steward should confirm it.
